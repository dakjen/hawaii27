<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <rect width="100" height="80" fill="#331A22"/>

  <!-- Palm tree fronds — 6 curved leaves fanning out from top -->
  <g stroke="#E6BFC7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 50 30 Q 32 20, 18 24"/>
    <path d="M 50 30 Q 30 32, 14 42"/>
    <path d="M 50 30 Q 34 42, 26 58"/>
    <path d="M 50 30 Q 68 20, 82 24"/>
    <path d="M 50 30 Q 70 32, 86 42"/>
    <path d="M 50 30 Q 66 42, 74 58"/>
  </g>

  <!-- Small frond detail dots along the leaves -->
  <g fill="#E6BFC7" opacity="0.5">
    <circle cx="26" cy="23" r="0.8"/>
    <circle cx="22" cy="34" r="0.8"/>
    <circle cx="30" cy="48" r="0.8"/>
    <circle cx="74" cy="23" r="0.8"/>
    <circle cx="78" cy="34" r="0.8"/>
    <circle cx="70" cy="48" r="0.8"/>
  </g>

  <!-- Trunk — gentle curve, tan -->
  <path
    d="M 47 30 Q 52 45, 48 62 Q 46 70, 44 72"
    fill="none"
    stroke="#E6BFC7"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Coconuts -->
  <circle cx="52" cy="33" r="2.2" fill="#E6BFC7"/>
  <circle cx="47" cy="34" r="2" fill="#E6BFC7"/>
</svg>
